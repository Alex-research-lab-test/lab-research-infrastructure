minimum_pre_commit_version: '4.3.0'
files: >-
  ^(AGENTS\.md$|lab-infrastructure-version\.json$|\.pre-commit-config\.yaml$|\.markdownlint-cli2\.jsonc$|\.github/|\.agents/|\.codex/|docs/lab/|tools/lab/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-ast
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: d7a4f7cf4914d3bffb9b83bdbc45fd2a00c91ff9  # v0.18.1
    hooks:
      - id: markdownlint-cli2
  - repo: local
    hooks:
      - id: codex-metadata
        name: Validate native Codex agent and skill metadata
        language: python
        additional_dependencies: [PyYAML==6.0.3]
        entry: python tools/lab/check_codex.py
        pass_filenames: false
        always_run: true
